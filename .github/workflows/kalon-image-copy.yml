# Wiki.js Kalon: copy published release images from another image name to this repository's image,
# without rebuilding, so each copy has the same digest. For a repository that was renamed after it
# published releases. Run by hand from the Actions tab or the API.
name: Kalon image copy

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Image to copy from, without a tag (for example ghcr.io/owner/old-name)'
        required: true
      tags:
        description: 'Release tags to copy, separated by spaces (for example 3.3.0-kalon.1 3.3.0-kalon.2)'
        required: true

permissions:
  contents: read

jobs:
  copy:
    name: Copy tags
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy
        env:
          FROM: ${{ inputs.from }}
          TAGS: ${{ inputs.tags }}
        run: |
          TO="ghcr.io/${GITHUB_REPOSITORY,,}"
          [[ "$FROM" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] || { echo "::error::from must be a ghcr.io image without a tag"; exit 1; }
          [ "$FROM" != "$TO" ] || { echo "::error::from is already this repository's image"; exit 1; }
          for tag in $TAGS; do
            [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+-kalon\.[0-9]+$ ]] || { echo "::error::Tag $tag is not <x.y.z>-kalon.<n>"; exit 1; }
            docker buildx imagetools create --tag "$TO:$tag" "$FROM:$tag"
            echo "$FROM:$tag -> $TO:$tag"
            docker buildx imagetools inspect "$TO:$tag" | head -3
          done
